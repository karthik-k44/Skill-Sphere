<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SkillSphere mark: the lucide "orbit" glyph from the logo, white on an Ink tile (inverted in dark tab bars). -->
  <style>
    .tile { fill: #1d1d1f; }
    .glyph { fill: none; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f5f5f7; }
      .glyph { stroke: #1d1d1f; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7.5" />
  <g class="glyph" transform="translate(5 5) scale(0.9167)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.341 6.484A10 10 0 0 1 10.266 21.85" />
    <path d="M3.659 17.516A10 10 0 0 1 13.74 2.152" />
    <circle cx="12" cy="12" r="3" />
    <circle cx="19" cy="5" r="2" />
    <circle cx="5" cy="19" r="2" />
  </g>
</svg>
